name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    # Integration tests spin up Infinispan Docker containers (single-server
    # plus multi-node clusters), which can take a few minutes to pull and boot.
    timeout-minutes: 30
    # Needed by the "Publish test-count badge" step to push the generated JSON
    # to the orphan `badges` branch using the built-in GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libgtest-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -LE integration

      # ubuntu-latest runners provide a running Docker daemon on the host, so
      # the integration tests (labeled "integration") can start Infinispan
      # containers via scripts/. This is Linux-only: the Fedora job runs inside
      # a container with no Docker daemon, and Windows doesn't build these tests.
      - name: Run integration tests (Docker)
        run: |
          cd build
          ctest --output-on-failure -L integration

      - name: Clean up test containers
        if: always()
        run: ./scripts/cleanup_test_containers.sh || true

      # Publish the real test counts (from the binaries that just passed) as a
      # shields.io endpoint badge. We render a tiny JSON and force-push it to the
      # orphan `badges` branch; the README embeds
      #   img.shields.io/endpoint?url=<raw badges/tests.json>
      # Only on a push to main (fork-PR runs get a read-only token and must not
      # publish), so the badge always reflects main — never an in-flight PR.
      - name: Publish test-count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r unit integration suites < <(scripts/count_tests.sh build)
          message="${unit} unit · ${integration} integration"
          echo "Badge: ${message} (${suites} suites)"
          work="$(mktemp -d)"
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"brightgreen"}\n' \
            "$message" > "$work/tests.json"
          cd "$work"
          git init -q
          git checkout -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json
          git commit -q -m "ci: test-count badge — ${unit} unit, ${integration} integration"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  test-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # vcpkg's x-gha binary cache (enabled by run-vcpkg) needs these two
      # runtime variables exported to the shell; they're available to Actions
      # internals but not to subsequent run steps unless exported here.
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Pin to a recent vcpkg release (2026.07.29). Older baselines
          # reference MSYS2 packages (e.g. pkgconf) that the mirrors have
          # since deleted, causing 404s during vcpkg_fixup_pkgconfig.
          vcpkgGitCommitId: 'c76c06644034521fb761a39f8f52d8e87d1103d5'

      - name: Install dependencies
        run: |
          vcpkg install openssl:x64-windows gtest:x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Run unit tests
        run: |
          cd build
          # Exclude integration tests: they require a running Infinispan
          # server via Docker, which CI does not provision.
          ctest -C Release --output-on-failure -LE integration

  test-fedora:
    name: Linux (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          dnf install -y cmake gcc-c++ openssl-devel gtest-devel

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          # Exclude integration tests: they require a running Infinispan
          # server via Docker, which CI does not provision.
          ctest --output-on-failure -LE integration
